plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.80'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
    // Adds the Kotlin Gradle plugin
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
    // OPTIONAL Kotlin Serialization plugin
    //id 'org.jetbrains.kotlin.plugin.serialization' version '2.0.0'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "$minecraft_version-$forge_version"

    // Add your AccessTransformer
    // accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')
    // Set to false because Forge has broken access transformers
    //validateAccessTransformers = true

    // Add Parchment parameter mappings
    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
        }

        server {
            server()
            gameDirectory.set(project.layout.projectDirectory.dir('run/server'))
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll('--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources').absolutePath)
        }
    }

    mods {
        "$mod_id" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup "thedarkcolour" }
    }
}

dependencies {
    implementation "thedarkcolour:kotlinforforge:$kff_version"
}

// Include assets and data from data generators
sourceSets.main.resources { srcDirs 'src/generated/resources/' }

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            'mod_license': project.mod_license,
            'mod_id': project.mod_id,
            'mod_version': project.version,
            'mod_name': project.mod_name,
            'mod_authors': project.mod_authors,
            'mod_description': project.mod_description,
            'forge_version_range': project.forge_version_range,
            'minecraft_version_range': project.minecraft_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties

    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

idea.project.settings {
    taskTriggers {
        afterSync generateModMetadata
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

compileKotlin {
    kotlinOptions.jvmTarget = "17"
}

// The below is only required if using 'maven-publish' and you want to publish to maven or use JitPack
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
